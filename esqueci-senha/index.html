<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"> <!-- link para os ícones -->
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>
<body>
    <main class="container">
        <form>
            <h1>Alterar Senha</h1>

            <div class="input-box">
                <input placeholder="digite seu email" type="email" name="email" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="código recebido por email" type="number" name="code" required>
                <i class="bx bxs-lock"></i>
            </div>

            <button type="submit" class="alterar">Alterar Senha</button>

            <div class="login-link">
                <p>Já tem uma conta? Faça <a href="../login/index.html">Login</a></p>
            </div>
            <div class="register-link">
                <p>Não tem uma conta? <a href="../cadastro/index.html">Cadastre-se</a></p>
            </div>
        </form>

    </main>
        <!-- Importa o fundo animado Gradient ASCII -->
    <script src="../ascii-bg.js"></script>
</body>
</html>
