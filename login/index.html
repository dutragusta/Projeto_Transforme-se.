<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <main class="container">
        <form>
            <h1>Entrar</h1>
            <div class="input-box">
                <input placeholder="Digite seu usuário" type="email" name="username" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Digite sua senha" type="password" name="password" required>
                <i class="bx bxs-lock"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar senha
                </label>
                <a href="../esqueci-senha/index.html">Esqueci a senha</a>
            </div>

            <button type="submit" class="login">Entrar</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="../cadastro/index.html">Cadastre-se</a></p>
            </div>
        </form>

    </main>
    <!-- Importa o fundo animado Gradient ASCII -->
    <script src="../ascii-bg.js"></script>
</body>
</html>
